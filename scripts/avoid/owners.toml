# owners.toml — the owner partitions scripts/avoid.sh checks (design §9.2; PLAN.md §5.1,
# §5.3; spec §2.7). Author-written; under scripts/, so guard rule 2g keeps it out of every
# learner and contractor edit.
#
# [conventions]  keys never compared as equal keys: names a language or its library fixes,
#                which recur in both tracks on different objects. A convention never hides
#                a word-run hit (artifact, curated type) or a token tripwire. Add a key only
#                with the convention it follows; never to silence a hit on an exercise name.
# [[artifact]]   design §9.2 item 3: what one track alone may build. A word run of the
#                owner's `words` inside a declaration key of the other track is a hit.
# [[tag]]        design §9.2 item 1: the surprises one track alone may pose as predictions.
#                `homes`: the owner's prediction items for it (an armed module's home must
#                exist; a planned one is pending). `tokens`: a name-level tripwire, a hit
#                when one occurs among the code tokens of the other track's P-item blocks.
#                A tag with no tokens is listed, never claimed as caught (spec §2.7: shape
#                overlaps are not name-checkable).
schema = 1

[conventions]
keys = [
  # Verus / vstd / Rust conventions
  "wf", "view", "new", "len", "get", "set", "push", "pop", "to_vec", "next", "clone",
  "default", "from", "into", "eq", "main",
  # Python
  "init",
  # Dafny dynamic frames (`Valid()`) and the failure-compatible type protocol of `:-`
  "valid", "is_failure", "propagate_failure", "extract",
  # option / result constructors and the empty value of a container or a language
  "none", "some", "ok", "err", "option", "result", "empty",
]

