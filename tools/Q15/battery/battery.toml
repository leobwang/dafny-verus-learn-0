# The trigger battery of Q15 (given; QPLAN §25.1, §25.3, §25.4). Twelve goals, each in a
# Dafny form and a Verus form, every file a whole program that stands alone. Each goal's
# last declaration is its statement (frozen) with a quantified step in its body; the
# step's trigger is the one choice the goal leaves open. Six goals are the predictions
# P6dv-P11dv (G01, G02, G03, G07, G09, G10); the toolsmith's tool (tools/Q15/toolsmith.py,
# rung 12) runs on all twelve, in both languages, and may change triggers only.

[[goal]]
id = "G01"
dafny = "tools/Q15/battery/dafny/G01.dfy"
verus = "tools/Q15/battery/verus/G01.rs"

