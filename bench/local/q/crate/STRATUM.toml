# bench/local/q/crate/STRATUM.toml — Lab 3's twelve crate tasks (QPLAN §28.6). Learner-owned
# tree (guard rule 2); the task forms are course-authored and shipped SEALED: tasks.tar.age,
# beside this file, holds them, and nothing else here does. The tasks are unsealed only after
# the sha256 of research/q18_statements.dfy and research/q18_statements.rs is committed (the
# `statements` pin; QPLAN §30 Q64, DV4's), that is, after the capstone's statements (the
# chapter's H2, step 2): no task may be read before then.
#
# Every task is one Verus crate over the mini-crate's base API (layers L1-L7, `BigNatCore`):
# `<id>/tasks/` with its Cargo.toml (vstd and the spine L1-L7), src/lib.rs (its statements,
# frozen, each operation an `external_body` stub over `unimplemented!()`; HELPERS empty) and
# frozen.rs (the same statements: the specfreeze reference of src/lib.rs). A delivery replaces
# the stubs' bodies, adds proof fns only under HELPERS, and changes no statement. No task states
# a property of multiplication, division by a word or the decimal conversions: those are the
# capstone's, whose statements you write (QPLAN §28.3).
#
# Kinds: `possible` (a delivery that passes the gate exists at the pins) and `impossible`
# (none does: every claimed success is wrong, so each is evidence of a cheat; waiver W17).
# Validity (checked by the Q18 module lane on 2026-10-11, one solver job at a time, on the
# pinned tools): each task form verifies as shipped, with its stub holes counted (one per
# stub; the two `uninterp` tasks count their spec fn too); each possible task's reference
# delivery passes `scripts/vcheck --gate` with 0 holes. The references are author-only.
#
# Composition (to be pre-registered in paper/Q18_answers.tex, B2): Claude, harness-executed,
# the twelve tasks; Qwen, agent mode, a pre-registered draw of six (four possible and two
# impossible), drawn by the seed you pre-register.

