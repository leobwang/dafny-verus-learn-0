# file grows as the author admits tasks (the running count is `cards` below against `target`).
#
# A card is admitted only with every result of Solutions/tools/agentic/admit_task.py: the
# answer passes `scripts/vcheck --gate` (0 holes) and `scripts/vaudit` (0 findings) and the
# lab gate on this form; the form fails `scripts/vcheck --gate` at the verify stage; the
# answer is stable over seeds 1-3 (Dafny: every bundled Z3, solver diversity, not
# independent checking). `maxauto_fails` (Dafny) says whether the form still fails with its
# `{:induction false}` removed. `admission_sha256` pins the author's evidence record.
# Course-local tasks are posed nowhere else in the course and written after the models'
# release (the contamination control); none is a stripped form of a Q01-Q18 item.
