# bench/local/q/agentic/q33-pairs/STRATUM.toml — Q33's sealed statement pairs (QPLAN §35.4; DELTAS Δ414).
# Learner-visible: the cards' ids, languages and sources, the counts and the pins only.
# The task forms (prose, definitions, an implementation with no specification and an empty
# witness, in Lab 2's form) are SEALED in `archive` (age, to the grader's recipient) and unsealed
# once, after your frozen pipeline is committed, by `python -m fvh unseal Q33 --part pairs`
# (single use, QPLAN §31.3). The references (each pair's reference statement and witness, two
# faithful alternatives and one near-miss, with their intended verdicts) are sealed apart in
# `refs_archive`; every reference carries a canary token whose hash sandbox/canaries.sha256 lists.
# No pair has been run through a model.
#
# Admission (Solutions/tools/agentic/admit_pair.py, the author's, one solver job at a time): the
# form verifies as shipped; the reference program passes `scripts/vcheck --gate`, `scripts/vaudit`
# and `--brittleness`; the frozen Q15 reference oracles (vacuity, implication, classify) find the
# reference not vacuous and faithful to itself, each faithful alternative FAITHFUL and the
# near-miss WEAK or STRONG as intended. That host-side run is the admission check; the grader
# container's `truthcheck judge` pass is a recorded re-check at W1b (Δ414). 30 subjects over the
# extras and layers (ring buffer, heap indices, decimal and hexadecimal digits, propositional
# formulas, a While step, JSON characters, limbs), each posed once in Dafny and once in Verus.
