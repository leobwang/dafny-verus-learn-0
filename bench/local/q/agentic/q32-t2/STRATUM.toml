# bench/local/q/agentic/q32-t2/STRATUM.toml — Q32's sealed tranche T2 (QPLAN §34.4; DELTAS Δ410).
# Learner-visible: the cards' ids, languages and sources, the counts and the pins only.
# The task forms are SEALED in `archive` (age, to the grader's recipient) and unsealed once,
# after your frozen agent and its retrieval index are committed, by
# `python -m fvh unseal Q32 --part T2` (single use; the tranche is then retired, QPLAN §31.3).
# The reference deliveries are sealed apart in `refs_archive`, each carrying a canary token
# whose hash sandbox/canaries.sha256 lists. No tranche task has been run through a model.
#
# Composition under D76's fallback (b) (Δ405): 40 tasks, 24 course-local and 16 public, plus 4
# Dafny spare cards. The public cards were drawn by Δ413's pre-registered walk: DafnyBench and
# vericoding's apps/verina answers with their proofs stripped. At unseal, a public card whose
# task your tree records as met is replaced by the next free spare (D76). Proof-search tasks:
# most ship their code and statement and need the proof. Admission as q31-dev's header says,
# and a tranche task must also fail under maximal automation (§34.4, Δ412). A task the first
# one-shot baseline sample closes at par-run is dropped from the analysis, as a census.
