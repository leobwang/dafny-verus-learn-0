# sandbox/attested.toml: the lab task cards the author attested (DV4-PLAN §5.4
# item 3). A card under bench/local/ enters a sandbox only when the sha256 of
# its stripped form is listed here. The author adds a card with
#   scripts/mksandbox-run --author --attest <card>
# which scans it against the reference twins' answer lines and the leak
# patterns first (author context only, Δ103); a study-mode run checks the hash
# only. The scan (scripts/dvl/sandbox.py author_scan; DV5e's recalibration, the
# user's decision D25): a hit is a span of a twin's answer lines of at least 10
# tokens that the card holds whole, or renamed (its identifiers renamed
# consistently); generic structure never counts: text a learner-visible course
# file shows, and, for the renamed test, shapes found in two or more installed
# public benchmark files and declaration headers, brackets and comments (an
# exact copy of a twin's span, names and all, still counts). Since DV6 (the
# user's decision D31) the twins also include Lab 2's sealed reference
# specifications and Lab 3's reference deliveries, read into memory at
# attestation time and never written; an exact copy of one counts even when the
# public pools show it. Each entry records the rule it passed (`scan`), the pools
# that rule read (`pools`) and the sealed twins it read (`refs`); a card attested
# under an earlier rule, or against other sealed references, is scanned again
# when attested again (`scripts/mksandbox-run --author --attest-rescan` re-scans
# every entry). Every entry was re-scanned under DV6 on 2026-10-14 (78 of 78
# re-attested): Lab 1's 22 and Lab 2's 20 cards, and Lab 3's 36 sealed crate
# files (bench/local/q/crate/tasks.tar.age) from the archive decrypted into
# memory, at the paths `fvh unseal Q18` writes (each entry's source); after
# Q15's DV6 re-seal (the user's decisions D27 and D28) the 78 were re-scanned
# again (78 of 78 re-attested) and Lab 2's ten public cards
# (bench/local/q/lab2pub/) were attested under DV6: 88 entries.
