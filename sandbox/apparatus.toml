# sandbox/apparatus.toml: the apparatus pins (DV4-PLAN §3.6; guard rule 2g),
# schema 1, read by fvh.apparatus (fvh run, fvh apparatus --check) and by
# scripts/dvl/sandbox.py for the model gate of an agent run. Every binary path,
# setting and candidate model server address fvh and the sandbox use comes from
# here, never from a default in code. A drift between the host and a binary or
# file pin refuses every batch until the probes are re-run and the pin is moved
# (fvh apparatus --check names the field and what to re-probe). The model
# server is not pinned (Δ505): it is the host's, found at run time.
#
# Written at DV4 step 3 (Docker and the local model, 2026-10-11) from the probes
# archived under the author probe archive's dv5b/dv4s3/ (Solutions/plans/DV4-
# author-notes.md §9). [window] and [backend.claude] were added at DV4 step 4a
# (the subscription, 2026-10-11) from tests/acceptance/claude_policy_smoke.py's
# run on the pinned version file (archive dv5b/dv4s4/, author notes §10).
# [A] marks a value chosen, not measured.

schema = 1

[defaults]
# the per-run caps of a non-lab run (fvh.budget.Caps' units); a lab's come from
# its pre-registration
calls = 40
turns = 40
wall_s = 2700
gpu_s = 3600

[window]
# fvh.budget.WindowRule (Δ148; DV4-PLAN §4.4): every Claude call's rate_limit_event
# must show isUsingOverage false and an overageStatus in allowed_overage (DV0's
# record and step 4a's: "rejected", org_level_disabled), else the batch stops as
# apparatus-mismatch; a status outside allowed_status, or a window at or above
# its threshold (the study reserve, design §15.3), defers the batch between
# attempts; a recorded event older than max_age_s means a sentinel call first.
allowed_overage = ["rejected"]
allowed_status = ["allowed"]
five_hour_max = 0.8      # [A]
seven_day_max = 0.6      # [A]
max_age_s = 18000        # one five-hour window

[backend.claude]
# Claude Code 2.1.306, the version file itself (never the `claude` link), so an
# auto-update cannot change the apparatus under a batch (author notes §1.7).
# The binary is the course's own copy of the version file (Δ500): the updater
# deletes old files from ~/.local/share/claude/versions/ (it deleted 2.1.296),
# so `scripts/get_toolchain.sh claude` copies the pinned one into the course's
# store, checks this sha256, and `--check` verifies it; the store keeps every
# copy it installed. Re-pinned from 2.1.296 (DV4 step 4a, from DV0's 2.1.288)
# after the probes of claude_policy_smoke.py (`pins` and `smoke`) passed on the
# copy (VERSIONS.md §1.4, §2.3).
version = "2.1.306"
binary = "~/.local/share/dafny-verus-learn-0/claude/versions/2.1.306"
sha256 = "520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe"
model = "claude-opus-5-5"
effort = "low"           # [A]
max_turns = 2            # a structured answer takes 2 turns (DV0; step 4a)
call_timeout_s = 600     # [A] one policy call's wall-clock cap
# What the init event still lists under the isolated config (step 4a, call 1 of
# the smoke): built-ins only, none loadable without a Skill tool. Any other entry
# (an installed plugin, a user or project skill) fails the init assertions.
builtin_plugins = ["cc-plugin-agents-md", "cc-plugin-plugin-authoring"]
builtin_skills = ["deep-research", "dataviz", "update-config", "verify", "debug", "code-review",
                  "simplify", "batch", "fewer-permission-prompts", "doctor", "loop", "schedule",
                  "claude-api", "workflow-authoring", "run", "run-skill-generator",
                  "plugin-authoring"]

[backend.qwen]
# opencode 1.18.25, the host binary DV0 probed (Δ64). Since Δ504 dvl-agent
# carries the upstream Linux release of the same version for its architecture
# (opencode-linux-x64.tar.gz, binary sha256 d91e0d33…, pinned in
# sandbox/build-images.sh), not this file: no release asset has this sha256
version = "1.18.25"
binary = "~/.opencode/bin/opencode"
sha256 = "5750524bbdd592157a3e1b4451038c1d05075365336cd74b8ec573f92b2924c0"
# no model pin: the model is whatever the host's server serves (Δ505; [model_gate])
provider_npm = "@ai-sdk/openai-compatible"    # bundled in 1.18.25 (probe: no fetch, no network)
call_timeout_s = 900     # [A]
# opencode's own default allow rule for its tmp directory (DV0's B3 record);
# its tool-output rule lies under the call's state directory and passes anyway
external_ok = ["/tmp/opencode/*"]

[model_gate]
# The course's model gate (Δ505). The model server is not the course's: an
# OpenAI-compatible server the host already runs on localhost (127.0.0.1) port
# 8000 or 8001, yours to run, like dafny, verus and uv (D78). Every run tries
# these base URLs in order and takes the first whose GET /models answers;
# DVL_MODEL_URL overrides the list (a loopback http URL: the gate sends no
# key). The model is the one the server serves (DVL_MODEL names it when the
# server serves several, or to take another one); its max_model_len, when the
# server reports one, bounds the context check. The URL, the model id and what
# /version or system_fingerprint report are recorded with every run as
# observed facts, never pinned. Write 127.0.0.1, never `localhost`, which may
# resolve to ::1.
endpoints = ["http://127.0.0.1:8000/v1", "http://127.0.0.1:8001/v1"]
# a prompt whose token count reaches the served max_model_len less the margin
# is flagged ctx-saturated (so is a request the server refuses for its length)
margin = 512
# The course's experimental settings, which the gate sets on every request as
# OpenAI fields (Δ65, Δ505): top_k and top_p at Qwen's sampling defaults, a
# temperature below its default 1 [A], one seed for a single-run replay [A] (a
# lab's per-run seeds are its pre-registration's), and max_tokens, one call's
# output cap, thinking included [A] (8192 cut a thinking step: Q07 replay run
# 1, finish "length", and opencode ends the session there). A server that
# ignores a field still receives it.
options = { temperature = 0.6, top_p = 0.95, top_k = 20, seed = 1, max_tokens = 32768 }

[pins]
toolchain_sha256 = "2dd90926faf099b45fcadba8f86d3042d75a4782de2592254c7bce32d5d73b21"
images_lock_sha256 = "8e50527235f62b85ea39dc797ea52c23307f4cfb658257c849a7008d72d5fb54"
