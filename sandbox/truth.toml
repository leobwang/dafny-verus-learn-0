# sandbox/truth.toml: the sealed hidden truth of the labs (DV4-PLAN §5.9, QPLAN §30
# Q49, design §10.3), schema 1; guard rule 2g. Read by scripts/dvl/sandbox.py's truth
# mode and written by the author-only sandbox/seal_hidden.py.
#
# Each [[lab]] pins its sealed archive (a course path under Hidden/, which no
# sandbox [[file]] may name, and its sha256), the age recipient it is sealed to,
# the pinned age binary that seals it (VERSIONS.md §1.4), and where the grader's
# key (the age identity) lives: on the author's machine, outside the checkout, in
# the reference class (~/.cache/dafny-verus-learn-0/, which the canonical deny
# rule and guard rule 1 keep from every study session). Only the image's grader
# (/opt/dvl/bin/truthcheck) unseals an archive, inside a network-less
# verification container (`scripts/mksandbox-run --truth <archive> --truth-check
# manifest|validate|judge`), and it prints verdict-level fields only. Each archive
# also carries judge/oracles.py, the frozen reference oracles the grader's
# `judge` mode loads (DV5d: they never sit in an image or a learner-visible file). `files` and
# `manifest_sha256` describe the plaintext tree (its file count and the sha256 of
# its MANIFEST.sha256), so the grader's check can be compared with the seal.
schema = 1

