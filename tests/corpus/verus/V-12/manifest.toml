# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
# Note: The later-layer rule takes the layer from the path, so the module
#   crate sits at verus/r/r02_probe (layer A1) and a stand-in later layer at
#   verus/given/rg_re_a4, both nested inside this fixture.
id = "V-12"
lang = "verus"
half = "R"
xclass = "X17"
kind = "construct"
title = "an A1 module crate calls a later layer's (A4) lemma by path (Delta 22, 99)"
files = ["verus/given/rg_re_a4/Cargo.toml", "verus/given/rg_re_a4/src/lib.rs", "verus/r/r02_probe/Cargo.toml", "verus/r/r02_probe/src/lib.rs"]
target = "verus/r/r02_probe"
plain_exit = 0
# plain run: verified 1, errors 0, success true, is-verifying-entire-crate true; path dependencies built first: rg_re_a4

[[expect]]
tool = "vcheck --gate"
outcome = "flagged"
kinds = ["later-layer"]
output_sha256 = "034afc822d130186ce083a786874b77082b5e4a29742fc5ea055650f335b56ea"
summary = "verdict failed, stage verify, verified 1; later-layer at verus/r/r02_probe/src/lib.rs:8; later-layer at verus/r/r02_probe/src/lib.rs:10; gate conditions missed: 2 lint finding(s)"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/V-12/verus/r/r02_probe"]
exit = 1

[[expect]]
tool = "vaudit"
outcome = "flagged"
kinds = ["later-layer"]
output_sha256 = "3b301024509a74c0a23f46f90911bb4eb7144e6f7e8a4ea7cb9f7cec05e12c32"
summary = "2 finding(s): later-layer at verus/r/r02_probe/src/lib.rs:8; later-layer at verus/r/r02_probe/src/lib.rs:10"
argv = ["scripts/vaudit", "tests/corpus/verus/V-12/verus/r/r02_probe"]
exit = 1
