# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
id = "C-6"
lang = "verus"
half = "R"
xclass = ""
kind = "control"
title = "a verified fn and a #[test] outside verus!"
files = ["Cargo.toml", "src/lib.rs"]
target = "."
plain_exit = 0
# plain run: verified 1, errors 0, success true, is-verifying-entire-crate true

[[expect]]
tool = "vcheck --gate"
outcome = "clean"
kinds = []
output_sha256 = "e6c7ad73276a490841e1bdd11098eb0d20860463b7f37e1e5280c682b543d568"
summary = "verdict verified, stage verify, verified 1"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/C-6"]
exit = 0

[[expect]]
tool = "vaudit"
outcome = "clean"
kinds = []
output_sha256 = "4a544e56e183f19be09c2c5761b20845faf0f888839e0c33049415bd9099e219"
summary = "0 finding(s)"
argv = ["scripts/vaudit", "tests/corpus/verus/C-6"]
exit = 0

[[expect]]
tool = "json-completeness"
outcome = "clean"
kinds = []
output_sha256 = "e22ecd71b0c91d577ba64adc762978f88f83918f22736c267604da8a97005c56"
summary = "the plain run's --output-json verification-results: success true, is-verifying-entire-crate true, verified 1, errors 0; func-details 3 entries; the check: success true, entire crate, verified >= 1 (output_sha256: of that verification-results object as sorted-key JSON plus a newline)"
argv = ["verus", "tests/corpus/verus/C-6/src/lib.rs", "--crate-type=lib", "--crate-name", "corpus_vc6", "--rlimit", "2", "--num-threads", "1", "--output-json", "--error-format=json", "--time"]
exit = 0

[[expect]]
tool = "seed-rerun"
outcome = "clean"
kinds = []
output_sha256 = "8ac850178f0e36e9c218dc740b42d5c847e2d8559f2908ede2beeec423321b9c"
summary = "vcheck --brittleness under seeds 1, 2, 3: seed 1 verified, seed 2 verified, seed 3 verified; stable; the resource-count spread line is advisory (its numbers are in the hash)"
argv = ["scripts/vcheck", "--brittleness", "tests/corpus/verus/C-6"]
exit = 0
