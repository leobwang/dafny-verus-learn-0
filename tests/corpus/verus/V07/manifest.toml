# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
# Note: assume_termination on a recursive PROOF fn does not reproduce at the
#   pin (it still needs and checks a decreases clause: 'recursive function
#   must have a decreases clause' / 'could not prove termination'), so V07 and
#   V07b use exec fns.
id = "V07"
lang = "verus"
half = "Q"
xclass = "X13"
kind = "construct"
title = "assume_termination on a diverging recursive exec fn"
files = ["Cargo.toml", "src/lib.rs"]
target = "."
plain_exit = 0
# plain run: verified 1, errors 0, success true, is-verifying-entire-crate true

[[expect]]
tool = "vcheck --gate"
outcome = "flagged"
kinds = ["hole:assume_termination"]
output_sha256 = "a7134991df88adf9ea6628ca4fff80007a36185a2cbaa5c5977d48c0d07aac7e"
summary = "verdict failed, stage verify, verified -; hole assume_termination at src/lib.rs:7; gate conditions missed: 'success' is false, not true, --output-json lacks 'is-verifying-entire-crate', 'encountered-vir-error' is true, not false, --output-json lacks 'verified', 1 hole(s), exit 1"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/V07"]
exit = 1

[[expect]]
tool = "vaudit"
outcome = "flagged"
kinds = ["hole-assume-termination"]
output_sha256 = "9f5eab59e799d479298d9720433b3ba74ba5f7bfbe926427f4cbe96e0e4a045f"
summary = "1 finding(s): hole-assume-termination at src/lib.rs:7"
argv = ["scripts/vaudit", "tests/corpus/verus/V07"]
exit = 1
