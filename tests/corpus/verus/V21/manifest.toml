# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
# Note: At the pin the false directive does not give a fake green: the plain
#   run fails in rustc const evaluation (E0080, the size check), and under
#   --no-cheating Verus reports the directive itself as an external_body hole
#   (W-V08 on a synthesized layout item), before that check. Kept as a
#   regression fixture of that behaviour.
id = "V21"
lang = "verus"
half = "R"
xclass = "X03"
kind = "construct"
title = "a global layout directive that is false on the host"
files = ["Cargo.toml", "src/lib.rs"]
target = "."
plain_exit = 1
# plain run: verified 1, errors 0, success false, is-verifying-entire-crate true

[[expect]]
tool = "vcheck --gate"
outcome = "flagged"
kinds = ["hole:external_body"]
output_sha256 = "db31bfae3dc00f6ab38dab52b2b1c9851af8c0fb357f47380abb0bfe73de22e3"
summary = "verdict failed, stage verify, verified -; hole external_body at src/lib.rs:6; gate conditions missed: 'success' is false, not true, --output-json lacks 'is-verifying-entire-crate', 'encountered-vir-error' is true, not false, --output-json lacks 'verified', 1 hole(s), exit 1"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/V21"]
exit = 1

[[expect]]
tool = "vaudit"
outcome = "flagged"
kinds = ["hole-external-body"]
output_sha256 = "48a946c600516a846611b25e6982f7e3cee635926915740826624c31f00718a4"
summary = "1 finding(s): hole-external-body at src/lib.rs:6"
argv = ["scripts/vaudit", "tests/corpus/verus/V21"]
exit = 1
