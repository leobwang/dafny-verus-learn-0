# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
id = "C-5"
lang = "verus"
half = "Q"
xclass = ""
kind = "control"
title = "a two-crate path dependency with no trust"
files = ["lower/Cargo.toml", "lower/src/lib.rs", "upper/Cargo.toml", "upper/src/lib.rs"]
target = "upper"
plain_exit = 0
# plain run: verified 1, errors 0, success true, is-verifying-entire-crate true; path dependencies built first: corpus_vc5_lower

[[expect]]
tool = "vcheck --gate"
outcome = "clean"
kinds = []
output_sha256 = "2258f75b379c1c821e6ca9d4f2cd332622b1231e7fd0c65e26855bfe4af9e6b5"
summary = "verdict verified, stage verify, verified 1"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/C-5/upper"]
exit = 0

[[expect]]
tool = "vaudit"
outcome = "clean"
kinds = []
output_sha256 = "37cb23c6e8440c4c77187be72e3086f568de11135fa7a22a5a16a3b7a3ccdbfe"
summary = "0 finding(s)"
argv = ["scripts/vaudit", "tests/corpus/verus/C-5/upper"]
exit = 0

[[expect]]
tool = "json-completeness"
outcome = "clean"
kinds = []
output_sha256 = "e22ecd71b0c91d577ba64adc762978f88f83918f22736c267604da8a97005c56"
summary = "the plain run's --output-json verification-results: success true, is-verifying-entire-crate true, verified 1, errors 0; func-details 5 entries; the check: success true, entire crate, verified >= 1 (output_sha256: of that verification-results object as sorted-key JSON plus a newline)"
# <deps>: the plain run's dependency output directory (run scratch), as test_corpus.py
# renders it.
argv = ["verus", "tests/corpus/verus/C-5/upper/src/lib.rs", "--crate-type=lib", "--crate-name", "corpus_vc5_upper", "--rlimit", "2", "--num-threads", "1", "--import", "corpus_vc5_lower=<deps>/corpus_vc5_lower.vir", "--extern", "corpus_vc5_lower=<deps>/libcorpus_vc5_lower.rlib", "-L", "<deps>", "--output-json", "--error-format=json", "--time"]
exit = 0

[[expect]]
tool = "seed-rerun"
outcome = "clean"
kinds = []
output_sha256 = "671ce1793eb4ad12f152fbfc9df6a433f5d65ba729839fcb03d116579e900c4e"
summary = "vcheck --brittleness under seeds 1, 2, 3: seed 1 verified, seed 2 verified, seed 3 verified; stable; the resource-count spread line is advisory (its numbers are in the hash)"
argv = ["scripts/vcheck", "--brittleness", "tests/corpus/verus/C-5/upper"]
exit = 0
