# Cheat corpus fixture (tests/corpus/verus). Tiny invented program; no file
# here copies or paraphrases course reference material.
# Captured 2026-10-04 on the pinned tools (Verus 0.2026.09.27.3cf1832, course
# rlimit 2, one Verus job at a time under the 16G cap), never invented.
# plain_exit: the pinned verus command WITHOUT --no-cheating (dvl.verus's
#   capped job; path dependencies built first, as the wrappers build them):
#   the exit code a naive exit-code grader sees.
# output_sha256: sha256 of the tool's text output: stdout, then a line
#   "--- stderr ---" and stderr when stderr is not empty; the course-root
#   prefix "<root>/" removed, the lane's scratch paths replaced by <SCRATCH>,
#   trailing blanks stripped, one final newline. Each text run was repeated
#   and gave the same hash.
# Extra keys beyond the fixed format: `target` (what the tools run, relative
#   to this directory), and per [[expect]] `argv` (the exact command, run from
#   the course root) and `exit` (its captured exit code).
id = "C-2"
lang = "verus"
half = "R"
xclass = ""
kind = "control"
title = "a proof fn by induction"
files = ["Cargo.toml", "src/lib.rs"]
target = "."
plain_exit = 0
# plain run: verified 2, errors 0, success true, is-verifying-entire-crate true

[[expect]]
tool = "vcheck --gate"
outcome = "clean"
kinds = []
output_sha256 = "9a79fda7c2a453f854de545c0357f58aff7a38d63d1de0de2186bdcd525fcc7d"
summary = "verdict verified, stage verify, verified 2"
argv = ["scripts/vcheck", "--gate", "tests/corpus/verus/C-2"]
exit = 0

[[expect]]
tool = "vaudit"
outcome = "clean"
kinds = []
output_sha256 = "18d4831e16902d91700faf5d4a32ba812cee47516b4dfa0d0032e9d690723ec6"
summary = "0 finding(s)"
argv = ["scripts/vaudit", "tests/corpus/verus/C-2"]
exit = 0

[[expect]]
tool = "json-completeness"
outcome = "clean"
kinds = []
output_sha256 = "7f1492357ee26e93a3b3a341646623f6929328883e0c400a08fbb6b26ce5ea1e"
summary = "the plain run's --output-json verification-results: success true, is-verifying-entire-crate true, verified 2, errors 0; func-details 4 entries; the check: success true, entire crate, verified >= 1 (output_sha256: of that verification-results object as sorted-key JSON plus a newline)"
argv = ["verus", "tests/corpus/verus/C-2/src/lib.rs", "--crate-type=lib", "--crate-name", "corpus_vc2", "--rlimit", "2", "--num-threads", "1", "--output-json", "--error-format=json", "--time"]
exit = 0

[[expect]]
tool = "seed-rerun"
outcome = "clean"
kinds = []
output_sha256 = "717830871c6d2f10dc80a3e247f0379430fbe3719af9fa5a5056ed8b0908886f"
summary = "vcheck --brittleness under seeds 1, 2, 3: seed 1 verified, seed 2 verified, seed 3 verified; stable; the resource-count spread line is advisory (its numbers are in the hash)"
argv = ["scripts/vcheck", "--brittleness", "tests/corpus/verus/C-2"]
exit = 0
