# Cheat-corpus manifest (Dafny) C-02. Outcomes captured on the pinned toolchain (dafny 4.11.0, Z3 4.12.1) on 2026-10-04,
# one solver job at a time through the wrappers (8G cap).
# plain_exit: dafny verify main.dfy -> exit 0; 2 verified, 0 errors; 0 warning position(s), 0 error line(s)
#   (dafny verify with only the resource pins: --resource-limit, --cores, --solver-path; Dafny defaults otherwise;
#    a refinement candidate runs together with frozen.dfy).
# output_sha256: sha256 of the tool's stdout then stderr, run from the course root, after: the root path -> <root>; the scratch root -> <scratch>; 'raw output: <path>' -> 'raw output: <raw>'; the brittleness resource-spread clause -> '<spread>'; every whitespace run -> one space; ends trimmed.
# vcheck --gate: scripts/vcheck --gate main.dfy
# vaudit: scripts/vaudit main.dfy
# swap-to-false: scripts/vcheck --gate swap.dfy (main.dfy with the conclusion replaced by false): flagged when it still verifies
# seed-rerun: scripts/vcheck --brittleness main.dfy (every pinned seed)
id = "C-02"
lang = "dafny"
half = "R"
xclass = ""
kind = "control"
title = "control: a lemma with a real inductive proof"
files = ["main.dfy", "swap.dfy"]
plain_exit = 0

[[expect]]
tool = "vcheck --gate"
outcome = "clean"
kinds = ["verdict:verified"]
output_sha256 = "905126658ac3c748df9ec8dd14ebea86735657a161b28caadaf62d8344ade072"
summary = "vcheck --gate main.dfy: exit 0, verdict verified, 2 tasks verified, verifier exit 0"

[[expect]]
tool = "vaudit"
outcome = "clean"
kinds = []
output_sha256 = "04ff4fe53369d7893bde765cb2fcc11a41fabf5f77f89d16282dc2e34ab276a2"
