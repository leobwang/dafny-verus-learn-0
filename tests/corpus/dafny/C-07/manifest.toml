# Cheat-corpus manifest (Dafny) C-07. Outcomes captured on the pinned toolchain (dafny 4.11.0, Z3 4.12.1) on 2026-10-04,
# one solver job at a time through the wrappers (8G cap).
# plain_exit: dafny verify main.dfy -> exit 0; 1 verified, 0 errors; 0 warning position(s), 0 error line(s)
#   (dafny verify with only the resource pins: --resource-limit, --cores, --solver-path; Dafny defaults otherwise;
#    a refinement candidate runs together with frozen.dfy).
# output_sha256: sha256 of the tool's stdout then stderr, run from the course root, after: the root path -> <root>; the scratch root -> <scratch>; 'raw output: <path>' -> 'raw output: <raw>'; the brittleness resource-spread clause -> '<spread>'; every whitespace run -> one space; ends trimmed.
# vcheck --gate: scripts/vcheck --gate main.dfy
# vaudit: scripts/vaudit main.dfy
# witness: scripts/vcheck --gate witness.dfy (main.dfy plus a test call with concrete arguments): flagged when it does not verify
# swap-to-false: scripts/vcheck --gate swap.dfy (main.dfy with the conclusion replaced by false): flagged when it still verifies
id = "C-07"
lang = "dafny"
half = "Q"
xclass = ""
kind = "control"
title = "control: a satisfiable requires with a witness"
files = ["main.dfy", "witness.dfy", "swap.dfy"]
