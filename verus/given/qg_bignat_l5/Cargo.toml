# qg_bignat_l5 — the BigNat spine, layer L5 (PROVIDED, complete; frozen, guard rule 2f).
# A layer crate depends on vstd and on every lower layer of its chain (Δ22): L1, L2, L3 and L4.
# Never a build script (build = false, Δ20, Δ78). Written by the author, not
# generated: scripts/gen_units.py lists it in verus/Cargo.toml once a module reaches it.
[package]
name = "qg_bignat_l5"
version = "0.1.0"
edition = "2021"
publish = false
build = false

[lib]
path = "src/lib.rs"

[dependencies]
vstd = "=0.0.0-2026-09-20-0158"
qg_bignat_l1 = { path = "../qg_bignat_l1" }
qg_bignat_l2 = { path = "../qg_bignat_l2" }
qg_bignat_l3 = { path = "../qg_bignat_l3" }
qg_bignat_l4 = { path = "../qg_bignat_l4" }

[package.metadata.verus]
verify = true
