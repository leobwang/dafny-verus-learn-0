# MODULES.toml — the module registry: one [[module]] table per module, Q01–Q33
# (the depth-ordered track, studied first) then R01–R16 (the topic-ordered
# track), then one [[coverage]] table per goal payload.
#
# Skills, hooks, scripts and CI read module facts from here; nothing hard-codes
# them. Check after every edit (scripts/ci.sh runs the same):
#
#     python3 scripts/check_course_map.py                 # exit 0 = consistent
#     python3 scripts/check_course_map.py --resolve Q04   # one record, as JSON
#     python3 scripts/check_course_map.py --items Q04 --json
#     python3 scripts/gen_units.py                         # regenerate the units
#
# (`--only registry|units|import-tiers|isolation|coverage|vocab` runs one group;
# `--list-nonplanned Q01-Q18` prints the armed ids.)
#
# LEARNER-VISIBLE by design: the registry names chapters, exercise files, banks,
# rubrics and cards, never reference or held-out material. The checker rejects
# any path into a reference tree and any field whose name mentions solutions.
# Author tooling finds a reference twin by convention (same stem). Changing this
# file is an authoring act (guard rule 2g).
#
# Fields (every one required, in this order; a planned module may name files
# that do not exist yet, following the naming below):
#   id                "Q01".."Q33" | "R01".."R16"
#   legacy_id         a pre-rename id or "" (none so far); --resolve accepts it
#   track             "Q" | "R", from the id
#   status            "shipped" (every path exists) | "authoring" (paths may be
#                     missing; a skill checks its own inputs) | "planned"
#                     (skills refuse; no unit is generated)
#   title
#   tier              Q, by id: survey (Q01) | intro (Q02–Q03) | moderate
#                     (Q04–Q06) | detailed (Q07–Q09) | practice-intro (Q10–Q12) |
#                     practice-intermediate (Q13–Q15) | practice-hard (Q16–Q18) |
#                     challenge (Q19–Q33);  R: ""
#   topic             Q19–Q33, by id: algorithms | quant | numerics | pl | agentic,
#                     three modules each;  otherwise ""
#   strands           Q: the strands S1..S13 the module sweeps. Each tier
#                     partitions S1–S13; from moderate on by family, in order
#                     A (S1–S5), B (S6–S8), C (S9–S13). Challenges: all 13.  R: []
#   langs             the module's languages, in this order: "d" (Dafny), "v"
#                     (Verus), "py" (Python). Equal to the languages of its files
#                     (exercises, exits, agentic, harness). Q01–Q18 and R carry d
#                     and v; py only from Q06 / R05
#   chapter           docs/<ID>_<Name>.md
#   exercises         learner files. Dafny dafny/<T>/<ID>_<Name>/{core,std}/*.dfy,
#                     Verus verus/<t>/<id>_<name>/src/*.rs (<name> = <Name> in
#                     snake_case), specimens specimens/<ID>/ (a trailing "/" names
#                     a directory), challenges under Challenges/<Topic>/
#   exits             closed-book exit files, outside every unit: Dafny
#                     dafny/<T>/<ID>_<Name>/exit/*.dfy, Verus src/exit.rs (never
#                     mod-declared). Required past planned for Q01–Q15, R06, R11
#   agentic           files a /contract session works in ([] = no contract run):
#                     Dafny .../agent/*.dfy, Verus src/agent.rs (never
#                     mod-declared), tools under tools/<ID>/
#   harness           the module's learner Python: harness/q/fvh_q/… (Q01–Q18),
#                     harness/r/fvh_r/… (R), agents/… (Q19–Q33). A Q01–Q18 gate
#                     file sits under harness/q/fvh_q/gate/ (guard rule 2s keeps
#                     Q's gate solo). Past planned, R16 lists its trust-report in
#                     exercises or harness, at a path under dafny/r/, verus/r/ or
#                     harness/r/ whose name holds trust_report or trust-report
#                     (rule 2s); no other module names such a path
#   bank              .claude/skills/instructor/banks/<ID>.md (Q19–Q33: the
#                     topic's defense_<topic>.md)
#   paper             true ⇔ paper/<ID>_problems.tex + paper/<ID>_answers.tex.
#                     True wherever card is non-empty (/grade-paper grades a card
#                     only as a [paper-card] problem of the pair, so every
#                     Q01–Q18 and R module) and wherever engines holds policy or
#                     agent (the lab's [pre-registration] problem, which unlocks
#                     its runs). OD11's "only where it pays" scopes the other
#                     written problems: R01, R03 and R07 hold cards only
#   rubric            paper/rubrics/<ID>_rubric.md ("" = none; required when
#                     paper = true)
#   card              the module's paper cards: cheatsheets.md ids "NN.N"; never
#                     shared between modules. Required for Q01–Q18 and R
#   build_target      "Q" (Q01–Q18, the default build) | "R" (built by name) |
#                     "Challenges" (Q19–Q33, built by the challenge gate)
#   units             the module's verification units, derived from exercises:
#                     one per (module, language, library tier), Dafny core, Dafny
#                     std, then the Verus crate. scripts/gen_units.py writes them
#                     for every non-planned module
#   layer             the spine layer of its tier, by id: Q01 L1, Q02–Q03 L2,
#                     Q04–Q06 L3, Q07–Q09 L4, Q10–Q12 L5, Q13–Q15 L6, Q16–Q18 L7;
#                     R02–R05 A1, R06 A1b (the band-1 facts layer, PLAN.md §2.2),
#                     R07–R08 A2, R09 A3, R10–R15 A4, R16 A5; else ""
#   engines           ⊆ contract (an interactive /contract session; ⇔ agentic is
#                     non-empty) | policy (headless `claude -p` / opencode policy
#                     runs, harness-executed runs) | agent (a tool-using agent in
#                     a per-run container), in that order
#   statements        Q19–Q33: the frozen statement files, each
#                     { path = "...", sha256 = "<64 hex>" | "PENDING" }; required
#                     past planned. A statement file's name holds "Statement"
#                     (guard rule 2f freezes Challenges/**/*Statement*).
#                     Otherwise []
#   deep_dive         Q only: R ids the chapter links as "Deep dive → Rnn".  R: []
#                     (no R record names a Q module)
#   review_bar        /review-code bar: it-reads | proof-shape |
#                     library-conventions | design-lite | design-judgment |
#                     library-pr | production | harness
#   persona           /discuss persona: sharp-dev | smt-skeptic | ml-engineer |
#                     journal-referee | risk-engineer | numerical-analyst |
#                     compiler-engineer | eval-skeptic
#   viva_mode         module (every R module) | tier (Q03, Q06, Q09, Q12, Q15,
#                     Q18) | defense (Q19–Q33) | none
#   tutor_max_rung    the highest hint rung /tutor may give, 1–5 (solo: ≤ 2)
#   solo              Q19–Q33: /contract refuses; agentic = []
#   solutions_policy  solutions-first (Q01–Q18, R) | verifier-graded |
#                     harness-graded | reference-impl (Q19–Q33)
#   write_d, write_v  the WRITE constructs per language, as slugs (`assert-by`;
#                     "/" joins alternatives). A slug in both lists is one paired
#                     WRITE unit: at most 6 units and 10 slugs per module. Every
#                     entry is tagged `uses:` by ≥ 2 checked H/X/T items of that
#                     language once the module leaves planned. Verus never lists
#                     integer-ring (rejected at the pin, Δ47)
#   recognise_d, recognise_v
#                     RECOGNISE constructs (a card, never required); disjoint from
#                     WRITE per language.  Q10–Q33: []
#   budget            the module's model-run ceilings, which fvh enforces:
#                     { claude_calls, claude_runs, qwen_calls, qwen_runs,
#                     gpu_hours }, non-negative integers; non-zero iff engines
#                     holds policy or agent. gpu_hours ≤ 10 per module (design
#                     §3: ≤ 10 GPU-h per lab) and ≤ 45 summed over the registry
#                     (design §11.3: the six labs' Qwen work in ≤ 45 GPU-h; Q07's
#                     replay hour comes out of the same pool). The lab caps scale
#                     with planned Qwen work: Q12 10 (4,400 calls), R12 80 (10,700 calls: the user's D50 and D56, DELTAS Δ295);
#                     Q15, R15 3 (1,200 / 960 calls); Q18, R16 9 (36 agent runs
#                     each) [A: design §11; DELTAS Δ176]
#   admissible        item id → { admitted, minutes, fallback } (design §7.5): a
#                     gated item carries 0 minutes and names its fallback. Past
#                     planned, every H item of Q10–Q18 has an entry. An admitted
#                     item outside its tier's line band adds exception =
#                     "<kind>: <why>", kind short-format band (D2, D7),
#                     statement-item (D6, D9) or hidden-check spec (D21); the
#                     item, its proof lines, kind and decision are recorded in
#                     check_course_map.py's OUT_OF_BAND, and an exception on any
#                     other item is refused (DELTAS)
#   imports           every .dfy/.rs/.py file of the module → its import tier:
#                     Dafny core | std | std-all, Verus prelude | seq_lib |
#                     arithmetic | all, Python py-std | py-fvh (allowlists in
#                     check_course_map.py). A given layer's files are declared by
#                     the first module of its layer. Past planned: every file.
#   concept_items     the D4 matrix, Q01–Q09 only: "S<k>.<concept>" (both
#                     languages) or "S<k>.<concept>@d|@v|@py" = [item ids] | "R"
#                     (reading) | "prose" (S12, S13 only)
#
# Empty values are written inline (`imports = {}`); a non-empty admissible,
# imports or concept_items table is written as a [module.<name>] sub-table after
# the record's last inline field (TOML attaches it to the [[module]] above).
#
# Item markers in course files (scripts/course_items.py is the one parser):
#   // item: <ID>.<K><n><lang> [S<k>] [format] [min=<m>]     (`#` in Python)
#   // uses: <slug>, …   // need: <fragment>   // pair: <ID>.<K><n><lang>
#
# After R16: the [[coverage]] rows (design §5), with the rule in their banner.

schema = 1

