# ============================================================================
# Coverage (design §5): one row per goal payload
# ============================================================================
#
# Every payload has a core home in BOTH tracks, in every language it lists:
#   q_homes    Q01–Q18 homes: a strand anchor Qxx.S<k> (S<k> among Qxx's
#              strands; it covers Qxx's languages), an item id Qxx.<K><n><lang>
#              (it covers its language; dv covers d and v), or a paper item
#              Qxx.B<n> (language-free; needs paper = true)
#   r_homes    R01–R16 homes: a module anchor Rxx (it covers Rxx's languages),
#              an item id, or a paper item Rxx.B<n>
#   langs      the languages the payload must be homed in ([] = language-free)
#   deepening  bare Q19–Q33 ids only: a challenge never counts as a home
#   gap        a deliberate hole or asymmetry, with its reason ("" = none)
# A home in a planned module is pending (counted, not an error). Once its module
# is past planned it must resolve: a strand anchor through a checked item in
# that strand (Q01–Q09: a concept_items key of that strand citing items), a
# module anchor through a checked item in each required language, an item id
# through its marker, a paper item through `% item: <id>` in the problems file.
# A home on a gated item (admitted = false) needs a gap that says so.

